services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pizza
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pizza}
      POSTGRES_DB: pizza
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pizza -d pizza"]
      interval: 5s
      timeout: 5s
      retries: 10
  init:
    build: .
    environment:
      DATABASE_URL: postgresql://pizza:${POSTGRES_PASSWORD:-pizza}@db:5432/pizza
    command: ["flask", "--app", "app:create_app", "init-db"]
    depends_on:
      db:
        condition: service_healthy
  web:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DATABASE_URL: postgresql://pizza:${POSTGRES_PASSWORD:-pizza}@db:5432/pizza
    depends_on:
      init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  postgres_data:
